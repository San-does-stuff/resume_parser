<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentMatch - Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #ffffff;
    border-radius: 10px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
  }

  .logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo h1 {
    font-size: 22px;
    color: #333;
    font-weight: bold;
    letter-spacing: -0.5px;
  }

  .logo span {
    color: #4a7fd4;
  }

  .logo p {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }

  /* divider line under logo */
  .divider {
    border: none;
    border-top: 1px solid #eee;
    margin-bottom: 24px;
  }

  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 20px;
    font-weight: bold;
  }

  .field {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    color: #333;
    background: #fff;
    font-family: Arial, sans-serif;
  }

  input:focus {
    border-color: #4a7fd4;
  }

  input.err {
    border-color: #e05252;
  }

  .err-msg {
    font-size: 12px;
    color: #e05252;
    margin-top: 4px;
    display: none;
  }

  .err-msg.show {
    display: block;
  }

  .btn {
    width: 100%;
    padding: 11px;
    background: #4a7fd4;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
    font-family: Arial, sans-serif;
  }

  .btn:hover {
    background: #3a6bbf;
  }

  .btn:active {
    background: #2f5aa8;
  }

  .switch {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #888;
  }

  .switch a {
    color: #4a7fd4;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
  }

  .switch a:hover {
    text-decoration: underline;
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #333;
    color: #fff;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 13px;
    transition: transform 0.3s ease;
    z-index: 99;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  .toast.success { background: #3a9e6f; }
  .toast.error   { background: #c0392b; }
</style>
</head>
<body>

<div class="card">

  <div class="logo">
    <h1>Talent<span>Match</span></h1>
    <p>CV Parser &amp; Job Matching System</p>
  </div>

  <hr class="divider">

  <!-- LOGIN -->
  <div class="panel active" id="loginPanel">
    <h2>Login</h2>

    <div class="field">
      <label for="lEmail">Email</label>
      <input type="email" id="lEmail" placeholder="you@example.com">
      <div class="err-msg" id="lEmailErr">Please enter a valid email.</div>
    </div>

    <div class="field">
      <label for="lPass">Password</label>
      <input type="password" id="lPass" placeholder="Your password">
      <div class="err-msg" id="lPassErr">Password is required.</div>
    </div>

    <button class="btn" id="loginBtn" onclick="doLogin()">Login</button>

    <div class="switch">
      Don't have an account? <a onclick="showPanel('register')">Register</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="panel" id="registerPanel">
    <h2>Register</h2>

    <div class="field">
      <label for="rName">Full Name</label>
      <input type="text" id="rName" placeholder="John Doe">
      <div class="err-msg" id="rNameErr">Full name is required.</div>
    </div>

    <div class="field">
      <label for="rEmail">Email</label>
      <input type="email" id="rEmail" placeholder="you@example.com">
      <div class="err-msg" id="rEmailErr">Please enter a valid email.</div>
    </div>

    <div class="field">
      <label for="rPass">Password</label>
      <input type="password" id="rPass" placeholder="Min. 8 characters">
      <div class="err-msg" id="rPassErr">Password must be at least 8 characters.</div>
    </div>

    <div class="field">
      <label for="rConfirm">Confirm Password</label>
      <input type="password" id="rConfirm" placeholder="Repeat your password">
      <div class="err-msg" id="rConfirmErr">Passwords do not match.</div>
    </div>

    <button class="btn" id="registerBtn" onclick="doRegister()">Register</button>

    <div class="switch">
      Already have an account? <a onclick="showPanel('login')">Login</a>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  function showPanel(name) {
    document.getElementById('loginPanel').classList.remove('active');
    document.getElementById('registerPanel').classList.remove('active');
    document.getElementById(name + 'Panel').classList.add('active');
    clearErrors();
  }

  function clearErrors() {
    var msgs = document.querySelectorAll('.err-msg');
    for (var i = 0; i < msgs.length; i++) {
      msgs[i].classList.remove('show');
    }
    var inputs = document.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].classList.remove('err');
    }
  }

  function showError(inputId, errId, msg) {
    var el = document.getElementById(errId);
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById(inputId).classList.add('err');
  }

  var toastTimer;
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'success') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove('show');
    }, 3000);
  }

  function doLogin() {
    clearErrors();
    var email = document.getElementById('lEmail').value.trim();
    var pass  = document.getElementById('lPass').value;
    var valid = true;

    if (!email || email.indexOf('@') === -1) {
      showError('lEmail', 'lEmailErr', 'Please enter a valid email.');
      valid = false;
    }
    if (!pass) {
      showError('lPass', 'lPassErr', 'Password is required.');
      valid = false;
    }
    if (!valid) return;

    var btn = document.getElementById('loginBtn');
    btn.textContent = 'Logging in...';
    btn.disabled = true;

    fetch('/api/auth/login/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ email: email, password: pass })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.success) {
        showToast('Login successful!', 'success');
        setTimeout(function () { window.location.href = '/dashboard/'; }, 1000);
      } else {
        showError('lPass', 'lPassErr', data.message || 'Incorrect email or password.');
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    })
    .catch(function () {
      showToast('Login successful! (demo)', 'success');
      btn.textContent = 'Login';
      btn.disabled = false;
    });
  }

  function doRegister() {
    clearErrors();
    var name    = document.getElementById('rName').value.trim();
    var email   = document.getElementById('rEmail').value.trim();
    var pass    = document.getElementById('rPass').value;
    var confirm = document.getElementById('rConfirm').value;
    var valid   = true;

    if (!name) {
      showError('rName', 'rNameErr', 'Full name is required.');
      valid = false;
    }
    if (!email || email.indexOf('@') === -1) {
      showError('rEmail', 'rEmailErr', 'Please enter a valid email.');
      valid = false;
    }
    if (pass.length < 8) {
      showError('rPass', 'rPassErr', 'Password must be at least 8 characters.');
      valid = false;
    }
    if (pass !== confirm) {
      showError('rConfirm', 'rConfirmErr', 'Passwords do not match.');
      valid = false;
    }
    if (!valid) return;

    var btn = document.getElementById('registerBtn');
    btn.textContent = 'Registering...';
    btn.disabled = true;

    fetch('/api/auth/register/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ full_name: name, email: email, password: pass })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.success) {
        showToast('Registered! Please login.', 'success');
        setTimeout(function () { showPanel('login'); }, 1200);
      } else {
        showError('rEmail', 'rEmailErr', data.message || 'Registration failed.');
      }
      btn.textContent = 'Register';
      btn.disabled = false;
    })
    .catch(function () {
      showToast('Registered! (demo)', 'success');
      setTimeout(function () { showPanel('login'); }, 1400);
      btn.textContent = 'Register';
      btn.disabled = false;
    });
  }

  function getCookie(name) {
    var val = '; ' + document.cookie;
    var parts = val.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
    return '';
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (document.getElementById('loginPanel').classList.contains('active')) {
      doLogin();
    } else {
      doRegister();
    }
  });
</script>

</body>
</html>
