<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ResumeAI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f3ee;
      color: #1a1814;
      min-height: 100vh;
    }
    nav {
      background: #1a1814;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      color: #faf9f6;
      text-decoration: none;
      font-size: 1.25rem;
    }
    .nav-link {
      color: #faf9f6;
      text-decoration: none;
      background: #2d5a3d;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    main {
      max-width: 620px;
      margin: 2.4rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #faf9f6;
      border: 1px solid #ccc8be;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }
    .card-header {
      background: #e8e4db;
      border-bottom: 1px solid #ccc8be;
      padding: 0.75rem 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b6760;
      font-size: 0.74rem;
      font-weight: 600;
    }
    .card-body {
      padding: 1.2rem;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }
    form {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
    }
    input {
      background: #e8e4db;
      border: 1px solid #ccc8be;
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
      font-size: 0.92rem;
      color: #1a1814;
    }
    input[name="username"],
    input[name="email"],
    input[name="password"] {
      grid-column: 1 / -1;
    }
    input:focus {
      outline: 2px solid #c7dcca;
      border-color: #2d5a3d;
    }
    button {
      grid-column: 1 / -1;
      background: #1a1814;
      color: #faf9f6;
      border: none;
      border-radius: 6px;
      padding: 0.72rem 1rem;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      margin-top: 0.2rem;
    }
    button:hover { background: #2d5a3d; }
    .error {
      color: #a12b2b;
      background: #f5e3e3;
      border: 1px solid #e6c6c6;
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.7rem;
      font-size: 0.86rem;
    }
    .meta {
      margin-top: 1rem;
      font-size: 0.88rem;
      color: #6b6760;
    }
    .meta a { color: #2d5a3d; font-weight: 600; text-decoration: none; }
    @media (max-width: 680px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="logo">ResumeAI</a>
    <a href="{% url 'login' %}" class="nav-link">Login</a>
  </nav>

  <main>
    <div class="card">
      <div class="card-header">Create Profile</div>
      <div class="card-body">
        <h1>Create account</h1>

        {% if messages %}
          {% for message in messages %}
            <p class="error">{{ message }}</p>
          {% endfor %}
        {% endif %}

        <form method="post" id="registerForm">
          {% csrf_token %}

          <input type="text" name="username" placeholder="Username" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <input type="text" name="fullname" placeholder="Full name">
          <input
              type="tel"
              name="phone"
              placeholder="98XXXXXXXX"
              maxlength="10"
              inputmode="numeric"
              pattern="9[0-9]{9}"
              oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">          
    <input type="text" name="location" placeholder="Location">
          <button type="submit">Register</button>
        </form>

        <p class="meta">Already have an account? <a href="{% url 'login' %}">Login</a></p>
      </div>
    </div>
  </main>
  <script>
document.addEventListener("DOMContentLoaded", () => {

    const form = document.getElementById("registerForm");

    const username = form.username;
    const email = form.email;
    const password = form.password;
    const fullname = form.fullname;
    const phone = form.phone;
    const location = form.location;

    // Create error box if it doesn't exist
    let errorBox = document.getElementById("formError");

    if (!errorBox) {
        errorBox = document.createElement("div");
        errorBox.id = "formError";
        form.parentNode.insertBefore(errorBox, form);
    }

    function showError(message) {
        errorBox.innerHTML = `<div class="error">${message}</div>`;
    }

    function clearError() {
        errorBox.innerHTML = "";
    }

    function invalid(input, message) {
        input.style.borderColor = "#d33";
        input.style.background = "#fff5f5";
        showError(message);
        return false;
    }

    function valid(input) {
        input.style.borderColor = "#2d8a4b";
        input.style.background = "#f4fff7";
        return true;
    }

    function validateUsername() {
        const value = username.value.trim();

        if (value.length < 3)
            return invalid(username, "Username must be at least 3 characters.");

        if (value.length > 20)
            return invalid(username, "Username cannot exceed 20 characters.");

        if (!/^[A-Za-z0-9_]+$/.test(value))
            return invalid(username, "Username can only contain letters, numbers and underscore (_).");

        valid(username);
        return true;
    }

    function validateEmail() {
        const value = email.value.trim();

        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!regex.test(value))
            return invalid(email, "Enter a valid email address.");

        valid(email);
        return true;
    }

    function validatePassword() {
        const value = password.value;

        if (value.length < 8)
            return invalid(password, "Password must be at least 8 characters.");

        if (!/[A-Z]/.test(value))
            return invalid(password, "Password must contain an uppercase letter.");

        if (!/[a-z]/.test(value))
            return invalid(password, "Password must contain a lowercase letter.");

        if (!/[0-9]/.test(value))
            return invalid(password, "Password must contain a number.");

        if (!/[!@#$%^&*(),.?":{}|<>_\-+=/\\[\]]/.test(value))
            return invalid(password, "Password should contain at least one special character.");

        valid(password);
        return true;
    }

    function validateFullname() {
        const value = fullname.value.trim();

        if (value === "") {
            fullname.style.borderColor = "";
            fullname.style.background = "";
            return true;
        }

        if (value.length < 3)
            return invalid(fullname, "Full name is too short.");

        if (!/^[A-Za-z ]+$/.test(value))
            return invalid(fullname, "Full name can only contain letters and spaces.");

        valid(fullname);
        return true;
    }

    function validatePhone() {
        const value = phone.value.trim();

        if (value === "") {
            phone.style.borderColor = "";
            phone.style.background = "";
            return true;
        }

        if (!/^\+?[0-9]{7,15}$/.test(value))
            return invalid(phone, "Phone number must contain 7-15 digits.");

        valid(phone);
        return true;
    }

    function validateLocation() {
        const value = location.value.trim();

        if (value === "") {
            location.style.borderColor = "";
            location.style.background = "";
            return true;
        }

        if (value.length < 2)
            return invalid(location, "Location is too short.");

        if (value.length > 100)
            return invalid(location, "Location is too long.");

        valid(location);
        return true;
    }

    // Real-time validation
    username.addEventListener("input", () => {
        clearError();
        validateUsername();
    });

    email.addEventListener("input", () => {
        clearError();
        validateEmail();
    });

    password.addEventListener("input", () => {
        clearError();
        validatePassword();
    });

    fullname.addEventListener("input", () => {
        clearError();
        validateFullname();
    });

    phone.addEventListener("input", () => {
        clearError();
        validatePhone();
    });

    location.addEventListener("input", () => {
        clearError();
        validateLocation();
    });

    // Form submit
    form.addEventListener("submit", function(e) {

        clearError();

        const ok =
            validateUsername() &&
            validateEmail() &&
            validatePassword() &&
            validateFullname() &&
            validatePhone() &&
            validateLocation();

        if (!ok) {
            e.preventDefault();

            const firstInvalid = form.querySelector("input[style*='211']");
            if (firstInvalid)
                firstInvalid.focus();
        }
    });

});
</script>
</body>
</html>
