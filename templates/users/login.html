<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ResumeAI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f3ee;
      color: #1a1814;
      min-height: 100vh;
    }
    nav {
      background: #1a1814;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      color: #faf9f6;
      text-decoration: none;
      font-size: 1.25rem;
    }
    .nav-link {
      color: #faf9f6;
      text-decoration: none;
      background: #2d5a3d;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    main {
      max-width: 520px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #faf9f6;
      border: 1px solid #ccc8be;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }
    .card-header {
      background: #e8e4db;
      border-bottom: 1px solid #ccc8be;
      padding: 0.75rem 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b6760;
      font-size: 0.74rem;
      font-weight: 600;
    }
    .card-body {
      padding: 1.2rem;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }
    form { display: grid; gap: 0.75rem; }
    input {
      background: #e8e4db;
      border: 1px solid #ccc8be;
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
      font-size: 0.92rem;
      color: #1a1814;
    }
    input:focus {
      outline: 2px solid #c7dcca;
      border-color: #2d5a3d;
    }
    button {
      background: #1a1814;
      color: #faf9f6;
      border: none;
      border-radius: 6px;
      padding: 0.72rem 1rem;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      margin-top: 0.2rem;
    }
    button:hover { background: #2d5a3d; }
    .error {
      color: #a12b2b;
      background: #f5e3e3;
      border: 1px solid #e6c6c6;
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.7rem;
      font-size: 0.86rem;
    }
    .meta {
      margin-top: 1rem;
      font-size: 0.88rem;
      color: #6b6760;
    }
    .meta a { color: #2d5a3d; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="logo">ResumeAI</a>
    <a href="{% url 'register' %}" class="nav-link">Register</a>
  </nav>

  <main>
    <div class="card">
      <div class="card-header">Account Access</div>
      <div class="card-body">
        <h1>Login</h1>

        {% if messages %}
          {% for message in messages %}
            <p class="error">{{ message }}</p>
          {% endfor %}
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="text" name="username" placeholder="Username" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>

        <p class="meta">New here? <a href="{% url 'register' %}">Create an account</a></p>
      </div>
    </div>
  </main>
</body>
</html>
